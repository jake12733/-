<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOKDO 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#030712] text-gray-100 flex h-screen overflow-hidden">

    <!-- [1] 로그인 화면 영역 -->
    <div id="view-login" class="absolute inset-0 z-50 bg-[#030712]">
        <!-- 배경 이미지 (bg.jpg 연결) -->
        <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: linear-gradient(rgba(3, 7, 18, 0.2), rgba(3, 7, 18, 0.2)), url('bg.jpg');"></div>

        <!-- 로그인 박스를 캐릭터 쪽(왼쪽)으로 더 당기기 위해 정렬 및 간격 수정 -->
        <div class="relative z-10 h-full flex items-center justify-center lg:justify-end lg:pr-32">
            <div class="bg-[#090d16]/90 backdrop-blur-md border border-red-900/40 rounded-3xl p-14 w-[540px] shadow-[0_0_100px_rgba(0,0,0,0.95)]">
                <!-- 로고 영역 -->
                <div class="text-center mb-10">
                    <h1 class="text-5xl font-black italic tracking-widest text-red-600 mb-2 drop-shadow-[0_0_20px_rgba(220,38,38,0.7)]">DOKDO</h1>
                    <p class="text-xs text-gray-400 tracking-[0.3em] uppercase font-medium">VAMPIR DASHBOARD</p>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <div class="text-left mb-1 pl-1">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">아이디</span>
                        </div>
                        <input type="text" id="loginId" value="dokdo폐왕" class="w-full bg-[#030712] border border-gray-800 text-gray-100 text-lg rounded-xl px-6 py-4 text-left focus:outline-none focus:border-red-600 transition shadow-inner">
                    </div>
                    <div>
                        <div class="text-left mb-1 pl-1">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">비밀번호</span>
                        </div>
                        <input type="password" placeholder="비밀번호를 입력하세요" class="w-full bg-[#030712] border border-gray-800 text-gray-100 text-lg rounded-xl px-6 py-4 text-left focus:outline-none focus:border-red-600 transition shadow-inner">
                    </div>
                    <button onclick="handleLogin()" class="w-full py-4 bg-gradient-to-r from-red-700 to-red-600 hover:from-red-600 hover:to-red-500 text-white text-lg font-bold tracking-wider rounded-xl transition-all cursor-pointer mt-6 shadow-[0_4px_30px_rgba(220,38,38,0.6)]">
                        접속하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- [2] 대시보드 화면 영역 (로그인 전 숨김) -->
    <div id="view-dashboard" class="hidden flex w-full h-full">
        <!-- 사이드바 영역 -->
        <aside class="w-64 bg-[#05070c] flex flex-col justify-between border-r border-gray-800/50 p-4">
            <div>
                <h1 class="text-xl font-bold italic tracking-wider text-red-600 mb-8 px-2">DOKDO</h1>
                <nav class="space-y-2">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg bg-red-600/15 text-red-500 font-medium text-sm transition text-left cursor-pointer">
                        <span>📊</span> 대시보드
                    </button>
                    <button onclick="switchTab('admin')" id="nav-admin" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/40 hover:text-gray-200 text-sm transition text-left cursor-pointer">
                        <span>👑</span> 운영진 관리
                    </button>
                </nav>
            </div>

            <div class="border-t border-gray-800/60 pt-4">
                <div class="text-xs text-gray-400 mb-3 px-2">
                    <span class="text-gray-200 font-semibold">dokdo폐왕</span> (admin)
                </div>
                <button onclick="handleLogout()" class="w-full py-2 bg-[#0d121f] hover:bg-red-600/20 hover:text-red-400 text-gray-300 text-xs font-semibold rounded-lg border border-gray-800 transition cursor-pointer">
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
            <!-- [대시보드 탭 내용] -->
            <div id="tab-dashboard" class="tab-content">
                <h2 class="text-2xl font-bold mb-6 text-gray-100">대시보드</h2>

                <div class="border border-red-600/40 rounded-xl p-4 bg-[#090d16] mb-6 shadow-sm">
                    <div class="flex items-center gap-2 text-red-500 font-semibold mb-1 text-sm">
                        <span>📢</span> 오늘의 공지
                    </div>
                    <p class="text-gray-300 text-sm">공지사항을 불러오고 있습니다...</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-[#090d16] border border-gray-800/80 rounded-xl p-5 flex flex-col justify-between">
                        <span class="text-xs text-gray-400 mb-2">현재 서버명</span>
                        <div class="flex items-center gap-2">
                            <input type="text" id="serverNameInput" value="모아르테2" class="bg-[#030712] border border-gray-700 text-gray-200 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-red-600 flex-1">
                            <button onclick="saveServerName()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition cursor-pointer">저장</button>
                        </div>
                    </div>

                    <div class="bg-[#090d16] border border-gray-800/80 rounded-xl p-5 flex flex-col justify-between">
                        <span class="text-xs text-gray-400 mb-2">오늘 날짜</span>
                        <div class="text-xl font-bold text-blue-400" id="currentDate">2026. 8. 26.</div>
                    </div>

                    <div class="bg-[#090d16] border border-gray-800/80 rounded-xl p-5 flex flex-col justify-between">
                        <span class="text-xs text-gray-400 mb-2">오늘 전체 참여 현황</span>
                        <div class="text-xl font-bold text-green-400">0명 참여 중 (0%)</div>
                    </div>
                </div>

                <div class="bg-[#090d16] border border-gray-800/80 rounded-xl p-5">
                    <div class="text-xs text-gray-400 mb-3">이번 셔플 기간</div>
                    <div class="flex items-center gap-1.5 text-xs text-blue-400 mb-1">
                        <span>📅</span> 기간: 2026.08.19 ~ 2026.09.02
                    </div>
                    <div class="text-lg font-bold text-amber-400 mb-2">총 14일 기준 셔플 기간 적용 중</div>
                    <div class="flex items-center gap-1.5 text-xs text-gray-400">
                        <span>💡</span> 셔플은 총 14일 기준으로 갱신됩니다.
                    </div>
                </div>
            </div>

            <!-- [운영진 관리 탭 내용] -->
            <div id="tab-admin" class="tab-content hidden">
                <h2 class="text-2xl font-bold mb-6 text-gray-100">운영진 관리</h2>
                <div class="bg-[#090d16] border border-gray-800/80 rounded-xl p-6">
                    <p class="text-gray-300 text-sm">운영진 관리 페이지 영역입니다.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 스크립트 제어 -->
    <script>
        function handleLogin() {
            document.getElementById('view-login').classList.add('hidden');
            const dash = document.getElementById('view-dashboard');
            dash.classList.remove('hidden');
            dash.classList.add('flex');
        }

        function handleLogout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                const dash = document.getElementById('view-dashboard');
                dash.classList.add('hidden');
                dash.classList.remove('flex');
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        function switchTab(tabName) {
            const dashboardTab = document.getElementById('tab-dashboard');
            const adminTab = document.getElementById('tab-admin');
            const navDashboard = document.getElementById('nav-dashboard');
            const navAdmin = document.getElementById('nav-admin');

            if (tabName === 'dashboard') {
                dashboardTab.classList.remove('hidden');
                adminTab.classList.add('hidden');
                navDashboard.className = "w-full flex items-center gap-2 px-3 py-2.5 rounded-lg bg-red-600/15 text-red-500 font-medium text-sm transition text-left cursor-pointer";
                navAdmin.className = "w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/40 hover:text-gray-200 text-sm transition text-left cursor-pointer";
            } else if (tabName === 'admin') {
                adminTab.classList.remove('hidden');
                dashboardTab.classList.add('hidden');
                navAdmin.className = "w-full flex items-center gap-2 px-3 py-2.5 rounded-lg bg-red-600/15 text-red-500 font-medium text-sm transition text-left cursor-pointer";
                navDashboard.className = "w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800/40 hover:text-gray-200 text-sm transition text-left cursor-pointer";
            }
        }

        function saveServerName() {
            const serverName = document.getElementById('serverNameInput').value;
            alert(`서버명이 "${serverName}"(으)로 저장되었습니다.`);
        }
    </script>
</body>
</html>
