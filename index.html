
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOKDO 시스템</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #030712;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* 로그인 화면 */
        #view-login {
            position: fixed;
            inset: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030712;
        }

        /* 배경 이미지 */
        .login-background {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* 배경 어둡게 */
        .login-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 0, 0.3);
        }

        /* 로그인창 오른쪽 배치 */
        .login-layout {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            padding-right: 2%;
        }

        .login-card {
            width: 380px;
            max-width: calc(100% - 32px);
            padding: 28px;
            border: 1px solid rgba(127, 29, 29, 0.7);
            border-radius: 16px;
            background: rgba(9, 13, 22, 0.96);
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
        }

        .logo {
            margin-bottom: 32px;
            text-align: center;
        }

        .logo h1 {
            margin: 0 0 8px;
            color: #dc2626;
            font-size: 46px;
            font-style: italic;
            letter-spacing: 7px;
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.7);
        }

        .logo p {
            margin: 0;
            color: #9ca3af;
            font-size: 11px;
            letter-spacing: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #1f2937;
            border-radius: 10px;
            outline: none;
            background: #030712;
            color: #ffffff;
            font-size: 14px;
        }

        input:focus {
            border-color: #dc2626;
        }

        input::placeholder {
            color: #4b5563;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #dc2626;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(220, 38, 38, 0.6);
        }

        .login-button:hover {
            background: #ef4444;
        }

        /* 대시보드 */
        #view-dashboard {
            display: none;
            width: 100%;
            height: 100%;
        }

        aside {
            width: 256px;
            padding: 16px;
            background: #05070c;
            border-right: 1px solid #1f2937;
        }

        aside h2 {
            margin: 8px 0 32px;
            color: #dc2626;
            font-style: italic;
            letter-spacing: 2px;
        }

        nav button,
        .logout-button {
            display: block;
            width: 100%;
            margin-bottom: 8px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #9ca3af;
            text-align: left;
            cursor: pointer;
        }

        nav button:hover,
        nav button.active,
        .logout-button:hover {
            background: rgba(220, 38, 38, 0.15);
            color: #ef4444;
        }

        .user-area {
            margin-top: 70vh;
            padding-top: 16px;
            border-top: 1px solid #1f2937;
            color: #9ca3af;
            font-size: 12px;
        }

        main {
            flex: 1;
            height: 100%;
            padding: 32px;
            overflow-y: auto;
        }

        .panel {
            padding: 20px;
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 12px;
            background: #090d16;
        }

        .hidden {
            display: none !important;
        }

        /* 모바일 */
        @media (max-width: 700px) {
            #view-login {
                align-items: center;
                justify-content: center;
            }

            .login-background {
                object-fit: cover;
            }

            .login-layout {
                justify-content: center;
                padding: 16px;
            }

            .login-card {
                width: 100%;
                padding: 28px 24px;
            }

            .logo h1 {
                font-size: 42px;
            }

            #view-dashboard {
                flex-direction: column;
                overflow-y: auto;
            }

            aside {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #1f2937;
            }

            .user-area {
                margin-top: 24px;
            }

            main {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

    <!-- 로그인 화면 -->
    <section id="view-login">

        <!-- index.html과 bg_2.jpg는 같은 폴더에 있어야 합니다 -->
        <img
            class="login-background"
            src="./bg_2.jpg"
            alt="로그인 배경">

        <div class="login-overlay"></div>

        <div class="login-layout">
            <div class="login-card">

                <div class="logo">
                    <h1>DOKDO</h1>
                    <p>VAMPIR DASHBOARD</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginId">아이디</label>

                        <input
                            id="loginId"
                            type="text"
                            value="dokdo폐왕"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="비밀번호를 입력하세요"
                            required>
                    </div>

                    <button
                        class="login-button"
                        type="submit">
                        접속하기
                    </button>
                </form>

            </div>
        </div>
    </section>

    <!-- 대시보드 화면 -->
    <section id="view-dashboard">

        <aside>
            <h2>DOKDO</h2>

            <nav>
                <button
                    id="dashboard-button"
                    class="active"
                    onclick="switchTab('dashboard')">
                    📊 대시보드
                </button>

                <button
                    id="admin-button"
                    onclick="switchTab('admin')">
                    👑 운영진 관리
                </button>
            </nav>

            <div class="user-area">
                <div>dokdo폐왕 (admin)</div>

                <button
                    class="logout-button"
                    onclick="handleLogout()">
                    로그아웃
                </button>
            </div>
        </aside>

        <main>
            <!-- 대시보드 -->
            <div id="tab-dashboard">
                <h1>대시보드</h1>

                <div class="panel">
                    <strong>📢 오늘의 공지</strong>
                    <p>공지사항을 불러오고 있습니다...</p>
                </div>
            </div>

            <!-- 운영진 관리 -->
            <div id="tab-admin" class="hidden">
                <h1>운영진 관리</h1>

                <div class="panel">
                    <p>운영진 관리 페이지 영역입니다.</p>
                </div>
            </div>
        </main>

    </section>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            document.getElementById("view-login").style.display = "none";
            document.getElementById("view-dashboard").style.display = "flex";
        }

        function handleLogout() {
            if (confirm("로그아웃 하시겠습니까?")) {
                document.getElementById("view-dashboard").style.display = "none";
                document.getElementById("view-login").style.display = "flex";
            }
        }

        function switchTab(tabName) {
            const dashboardTab = document.getElementById("tab-dashboard");
            const adminTab = document.getElementById("tab-admin");

            const dashboardButton = document.getElementById("dashboard-button");
            const adminButton = document.getElementById("admin-button");

            if (tabName === "dashboard") {
                dashboardTab.classList.remove("hidden");
                adminTab.classList.add("hidden");

                dashboardButton.classList.add("active");
                adminButton.classList.remove("active");
            }

            if (tabName === "admin") {
                dashboardTab.classList.add("hidden");
                adminTab.classList.remove("hidden");

                dashboardButton.classList.remove("active");
                adminButton.classList.add("active");
            }
        }
    </script>

</body>
</html>
